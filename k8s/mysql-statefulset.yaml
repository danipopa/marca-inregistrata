apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: marca-mysql
  namespace: inregistrare-marca
  labels:
    app.kubernetes.io/name: marca-mysql
spec:
  serviceName: marca-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marca-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marca-mysql
    spec:
      containers:
        - name: mysql
          image: docker.io/library/mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: marca_inregistrata_production
            - name: MYSQL_USER
              value: marca
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marca-mysql-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marca-mysql-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: initdb
          configMap:
            name: marca-mysql-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: marca-local
        resources:
          requests:
            storage: 5Gi
