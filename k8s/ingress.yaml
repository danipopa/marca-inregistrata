apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marca-inregistrata
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: marca-inregistrata.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: marca-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marca-web
                port:
                  name: http
