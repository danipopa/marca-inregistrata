apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: inregistrare-marca
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dani@mobiletel.eu # <-- CHANGE THIS TO YOUR EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
