apiVersion: apps/v1
kind: Deployment
metadata:
  name: marca-web
  labels:
    app.kubernetes.io/name: marca-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marca-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marca-web
    spec:
      containers:
        - name: web
          image: ghcr.io/danipopa/marca-inregistrata-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: marca-web-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
