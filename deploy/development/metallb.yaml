apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: inregistrare-marca
  namespace: metallb-system
spec:
  addresses:
    - 192.168.100.240/32
  autoAssign: false
  serviceAllocation:
    namespaces:
      - inregistrare-marca
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: inregistrare-marca
  namespace: metallb-system
spec:
  ipAddressPools:
    - inregistrare-marca
