default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    adapter: mysql2
    encoding: utf8mb4
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: <%= ENV.fetch("DATABASE_NAME", "marca_inregistrata_production") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "marca") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD") %>
    host: <%= ENV.fetch("DATABASE_HOST", "marca-mysql") %>
    port: <%= ENV.fetch("DATABASE_PORT", 3306) %>
  cache:
    adapter: mysql2
    encoding: utf8mb4
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: <%= ENV.fetch("DATABASE_CACHE_NAME", "marca_inregistrata_cache") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "marca") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD") %>
    host: <%= ENV.fetch("DATABASE_HOST", "marca-mysql") %>
    port: <%= ENV.fetch("DATABASE_PORT", 3306) %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: mysql2
    encoding: utf8mb4
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: <%= ENV.fetch("DATABASE_QUEUE_NAME", "marca_inregistrata_queue") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "marca") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD") %>
    host: <%= ENV.fetch("DATABASE_HOST", "marca-mysql") %>
    port: <%= ENV.fetch("DATABASE_PORT", 3306) %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: mysql2
    encoding: utf8mb4
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: <%= ENV.fetch("DATABASE_CABLE_NAME", "marca_inregistrata_cable") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "marca") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD") %>
    host: <%= ENV.fetch("DATABASE_HOST", "marca-mysql") %>
    port: <%= ENV.fetch("DATABASE_PORT", 3306) %>
    migrations_paths: db/cable_migrate
